version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Reverse Proxy / Gateway
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: securemeet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - securemeet-network

  # ---------------------------------------------------------------------------
  # Frontend Application (React + Vite)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securemeet-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    networks:
      - securemeet-network

  # ---------------------------------------------------------------------------
  # Backend API (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securemeet-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - securemeet-network

  # ---------------------------------------------------------------------------
  # Background Task Worker (Celery)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securemeet-celery-worker
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      - backend
      - redis
    networks:
      - securemeet-network

  # ---------------------------------------------------------------------------
  # Celery Beat (Scheduled Jobs)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securemeet-celery-beat
    command: celery -A app.tasks.celery_app.celery beat --loglevel=info
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - securemeet-network

  # ---------------------------------------------------------------------------
  # Primary Database (PostgreSQL)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: securemeet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securemeet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_insecure_password}
      POSTGRES_DB: ${POSTGRES_DB:-securemeet_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securemeet_admin} -d ${POSTGRES_DB:-securemeet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securemeet-network

  # ---------------------------------------------------------------------------
  # In-Memory Cache & Message Broker (Redis)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: securemeet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securemeet-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  securemeet-network:
    driver: bridge
